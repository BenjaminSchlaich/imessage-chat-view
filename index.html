<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages Archive</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main id="setup" class="setup">
    <div class="setup-card">
      <div class="bubble-icon">•••</div>
      <h1>Chat View</h1>
      <p>Choose an <code>imessage-exporter</code> HTML archive to browse it privately on this Mac.</p>
      <button id="choose-archive" class="primary">Choose archive folder…</button>
      <p id="setup-status" class="setup-status" role="status"></p>
      <small>Your archive stays on your computer.</small>
    </div>
  </main>
  <main id="chat" class="shell" hidden>
    <aside class="sidebar">
      <header><h1>Messages</h1><button id="theme" aria-label="Toggle appearance">◐</button></header>
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search" autocomplete="off"><kbd>⌘K</kbd></label>
      <div id="status" class="status">Indexing your archive…</div>
      <div id="list" class="list" role="listbox"></div>
    </aside>
    <section class="viewer">
      <div id="empty" class="empty"><div class="bubble-icon">•••</div><h2>Your message archive</h2><p>Select a conversation or search across all messages.</p></div>
      <iframe id="frame" title="Conversation" hidden></iframe>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
